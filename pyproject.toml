[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lint-agent-ai"
version = "0.1.0"
description = "AI-powered linting that learns your codebase style and flags deviations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["linting", "ai", "claude", "anthropic", "code-quality", "style"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
lint-agent = "lint_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
"Homepage" = "https://github.com/example/lint-agent-ai"
"Bug Tracker" = "https://github.com/example/lint-agent-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["lint_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
